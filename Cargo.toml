[package]
name = "cargo-online"
version = "0.1.0"
edition = "2024"
description = "Run Rust comparison mutants against a shared unit-test binary"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["signal"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
rayon = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
walkdir = "2"
